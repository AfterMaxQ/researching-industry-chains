[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "researching-industry-chains"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
  "openpyxl>=3.1,<4",
  "filelock>=3.16,<4",
  "fastapi>=0.115,<1",
  "starlette>=0.46,<1",
  "uvicorn>=0.30,<1"
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
industry-chain = "industry_chain_skills.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
industry_chain_skills = ["web_dist/**"]
